name: Nurix
description: Nurix AI is an enterprise agentic AI platform for sales and customer support, delivering
  AI voice and chat agents that qualify leads, resolve support issues, and automate back-office operations
  across voice, chat, and messaging channels. Its products include NuPlay (customer-facing conversational
  AI agents) and NuStack (a workflow automation engine), backed by a library of 400+ pre-built integrations
  spanning CRM, contact-center (CCaaS), e-commerce/order-management, messaging, and scheduling systems.
  Nurix is backed by General Catalyst. As of this profile the company exposes no public developer API
  surface — engagement is via sales/demo and pre-built connectors rather than self-serve API keys or developer
  documentation.
